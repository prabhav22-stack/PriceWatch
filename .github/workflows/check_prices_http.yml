name: Check Prices (HTTP Tier 1-3)

on:
  schedule:
    # Runs every 15 minutes (Public repo allows unlimited free runner minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: pricewatch-check-http
  cancel-in-progress: false

jobs:
  check-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Ping Render Web Service (Keep-Alive)
        if: env.RENDER_HEALTHZ_URL != ''
        env:
          RENDER_HEALTHZ_URL: ${{ secrets.RENDER_HEALTHZ_URL }}
        run: |
          curl -s -f "$RENDER_HEALTHZ_URL" || true

      - name: Execute HTTP Check Worker
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: |
          python -m pricewatch.entrypoints.worker_cli --tier HTTP --batch-size 40
